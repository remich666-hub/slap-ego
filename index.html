    panDown() { play('pandown', .6, 1); if (!CH[ci].tk && Math.random() < .6) { lastLaugh = clock; play('laugh2', .7, rand(.97, 1.03), .25); } },
    laugh(force) { if (CH[ci].tk) return; if (!force && clock - lastLaugh < 3) return; lastLaugh = clock; play('laugh', .75, rand(.97, 1.03)); },
    laugh3() { lastLaugh = clock; play('laugh3', .8, 1); },
    kpurr() { play('purr', .7, 1); }, kpet(side, alt) { play(alt ? (side === 'fore' ? 'pet4' : 'pet3') : (side === 'fore' ? 'pet2' : 'pet1'), .85, 1); }, kgrowl() { play('growl', .85, 1); }, khiss(two) { play(two ? 'hiss2' : 'hiss', 1, 1); },
    kfinal() { play('final', .95, 1); }, kslap() { playAbs('fore1', 1, .9); playAbs('back1', .55, 1.1); },
    stamp() { this.tones([170, 85], 'square', .09, .05); }, beat() { this.sweep(85, 38, .16, .3, 'sine'); },
    enter() { lastLaugh = clock; tkT = clock; play('enter', .8, 1); },
    taunt(key, rate) { this.stopTaunt(); const s = play('tk_' + key, .85, rate); if (s) { tkSrc = s; tkT = clock; lastLaugh = clock; } },
    stopTaunt() { if (tkSrc) { try { tkSrc.g.gain.setTargetAtTime(0, ac.currentTime, .03); tkSrc.s.stop(ac.currentTime + .15); } catch (e) {} tkSrc = null; } },
    // --- petits sons synthétisés (interface) ---
    tones(list, type, gain, dur, delay) { if (!ac || !audioOn || paused) return; const t0 = ac.currentTime + (delay || 0);
      list.forEach((f, i) => { const t = t0 + i*dur, o = ac.createOscillator(), gg = ac.createGain(); o.type = type || 'square'; o.frequency.setValueAtTime(f, t);
        gg.gain.setValueAtTime(0, t); gg.gain.linearRampToValueAtTime(gain*5, t + .005); gg.gain.exponentialRampToValueAtTime(.001, t + dur*1.6);
        o.connect(gg); gg.connect(master); o.start(t); o.stop(t + dur*1.7); }); },
    sweep(f0, f1, dur, gain, type, delay) { if (!ac || !audioOn || paused) return; const t = ac.currentTime + (delay || 0), o = ac.createOscillator(), gg = ac.createGain(); o.type = type || 'square';
      o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur); gg.gain.setValueAtTime(gain*5, t); gg.gain.exponentialRampToValueAtTime(.001, t + dur*1.2);
      o.connect(gg); gg.connect(master); o.start(t); o.stop(t + dur*1.3); },
    tap() { this.tones([660, 990], 'square', .05, .035); },
    mission() { this.tones([880, 1109, 1319, 1760], 'square', .06, .07); },
    trophy() { this.tones([784, 988, 1175, 1568], 'triangle', .14, .08); this.tones([1568], 'square', .04, .25, .32); },
    rankUp() { this.tones([523, 659, 784, 1047], 'square', .07, .1); this.tones([1047, 1319], 'triangle', .16, .35, .4); },
    timeBonus() { this.sweep(700, 1400, .09, .06, 'square'); this.tones([1760], 'triangle', .1, .06, .09); },
    multUp(m) { this.tones([330*Math.pow(1.19, m), 330*Math.pow(1.19, m + 1)], 'square', .05, .05); },
    tick(last) { this.tones([last ? 1320 : 990], 'square', .06, .025); },
    timeUp() { this.sweep(1200, 300, .5, .07, 'square'); },
    lose() { this.tones([392, 370, 349, 262], 'triangle', .18, .22); },
    koBoom() { if (!ac || !audioOn || paused) return; const t = ac.currentTime;                        // K.O. : grosse basse qui tombe + cymbale, puis fanfare arcade
      const o = ac.createOscillator(), gg = ac.createGain(); o.frequency.setValueAtTime(110, t); o.frequency.exponentialRampToValueAtTime(28, t + .7);
      gg.gain.setValueAtTime(1.1, t); gg.gain.exponentialRampToValueAtTime(.001, t + .9); o.connect(gg); gg.connect(master); o.start(t); o.stop(t + .95);
      const n = ac.createBufferSource(), f = ac.createBiquadFilter(), g2 = ac.createGain(); n.buffer = noise(); n.loop = true; f.type = 'highpass'; f.frequency.value = 3500;
      g2.gain.setValueAtTime(.35, t); g2.gain.exponentialRampToValueAtTime(.001, t + 1.4); n.connect(f); f.connect(g2); g2.connect(master); n.start(t); n.stop(t + 1.45);
      this.tones([440, 523, 659], 'square', .07, .09, .55); this.tones([880], 'square', .07, .55, .82); this.tones([440], 'triangle', .14, .55, .82); },
    fight(short) { if (!ac || !audioOn || paused) return; const t = ac.currentTime;                     // BAFFE ! : coup sourd + cloche de ring
      const o = ac.createOscillator(), gg = ac.createGain(); o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(40, t + .35);
      gg.gain.setValueAtTime(short ? .6 : .95, t); gg.gain.exponentialRampToValueAtTime(.001, t + .45); o.connect(gg); gg.connect(master); o.start(t); o.stop(t + .5);
      play('fore1', short ? .5 : .8, .9);
      this.tones([1568, 2093], 'triangle', short ? .07 : .11, .3, .02); if (!short) this.tones([1568, 2093], 'triangle', .09, .3, .34); },
    bell() { this.tones([1568, 2093], 'triangle', .1, .35); this.tones([1568, 2093], 'triangle', .1, .35, .45); },
    ctx: () => ac, out: () => master,
  };
})();

// ---------- Musique : boucles chiptune générées en direct (aucun fichier), sous les effets ----------
const music = (() => {
  const mf = m => 440*Math.pow(2, (m - 69)/12);
  const SONGS = {
    // menu : écran de sélection façon arcade, 120 bpm, arpèges en double croches ; la mineur - fa - do - mi
    menu: { bpm: 120, roots: [45, 41, 48, 40], minor: [1, 0, 0, 0], bass: [0, null, null, 12, null, null, 0, null, 0, null, null, 12, null, null, 7, null],
      arp: true, chord: [], hat: [2, 6, 10, 14], kick: [0, 4, 8, 12], snare: [], lead: null, vol: .85 },
    // combat : thème de boss oppressant, 140 bpm, la phrygien (demi-ton la - si bémol), basse obstinée, montée chromatique en fin de cycle
    game: { bpm: 140, roots: [45, 45, 46, 45, 45, 45, 48, 47], minor: [1, 1, 1, 1, 1, 1, 1, 1], bass: [0, null, 0, 0, null, 0, 1, null, 0, null, 0, 0, null, 12, 1, null],
      stab: [0, 10], hat: [0, 2, 4, 6, 8, 10, 12, 14], kick: [0, 4, 8, 12, 14], snare: [4, 12], fill: [12, 13, 14, 15], leadEvery: 1,
      lead: [[76, null, 77, null, 76, null, 74, null, 76, null, null, null, 72, null, 71, null], [69, null, 70, null, 69, null, 67, null, 69, null, null, null, null, null, null, null],
             [77, null, 78, null, 77, null, 76, null, 77, null, null, null, 74, null, 72, null], [70, null, null, null, 69, null, null, null, 70, null, 72, null, 74, null, 76, null],
             [76, null, 77, null, 76, null, 74, null, 76, null, null, null, 72, null, 71, null], [69, null, 70, null, 72, null, 74, null, 76, null, 77, null, 76, null, 74, null],
             [79, null, null, null, 77, null, null, null, 76, null, null, null, 74, null, null, null], [75, null, null, null, 74, null, null, null, 72, null, null, null, 71, null, null, null]], vol: 1 },
  };
  let mg = null, cur2 = null, want = null, step = 0, next = 0, timer = 0, rate = 1, loops = 0;
  const voice = (type, f, t, dur, gain, filt) => { const ac = sfx.ctx(), o = ac.createOscillator(), gg = ac.createGain(); o.type = type; o.frequency.setValueAtTime(f, t);
    gg.gain.setValueAtTime(0, t); gg.gain.linearRampToValueAtTime(gain, t + .006); gg.gain.exponentialRampToValueAtTime(.0008, t + dur);
    let n = o; if (filt) { const fl = ac.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = filt; o.connect(fl); n = fl; } n.connect(gg); gg.connect(mg); o.start(t); o.stop(t + dur + .02); };
  let nbuf = null; const noiseB = () => { const ac = sfx.ctx(); if (!nbuf) { nbuf = ac.createBuffer(1, ac.sampleRate*.2, ac.sampleRate); const d = nbuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random()*2 - 1; } return nbuf; };
  const hit = (t, type) => { const ac = sfx.ctx();
    if (type === 'kick') { const o = ac.createOscillator(), gg = ac.createGain(); o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(42, t + .12);
      gg.gain.setValueAtTime(.55, t); gg.gain.exponentialRampToValueAtTime(.001, t + .16); o.connect(gg); gg.connect(mg); o.start(t); o.stop(t + .18); return; }
    const n = ac.createBufferSource(), f = ac.createBiquadFilter(), gg = ac.createGain(); n.buffer = noiseB();
    f.type = type === 'hat' ? 'highpass' : 'bandpass'; f.frequency.value = type === 'hat' ? 7000 : 1800; const d = type === 'hat' ? .035 : .13;
    gg.gain.setValueAtTime(type === 'hat' ? .07 : .28, t); gg.gain.exponentialRampToValueAtTime(.001, t + d); n.connect(f); f.connect(gg); gg.connect(mg); n.start(t); n.stop(t + d + .02); };
  function tick() {
    const ac = sfx.ctx(); if (!ac || !mg) return;
    if (want !== cur2) {                                                            // changement de morceau : court fondu
      const t = ac.currentTime; mg.gain.cancelScheduledValues(t); mg.gain.setValueAtTime(mg.gain.value, t); mg.gain.linearRampToValueAtTime(0, t + .25);
      cur2 = want; step = 0; loops = 0; next = t + .3; if (cur2) mg.gain.linearRampToValueAtTime(.75*SONGS[cur2].vol, t + .55);
    }
    if (!cur2 || ac.state !== 'running') return;
    const S2 = SONGS[cur2], sd = 60/(S2.bpm*rate)/4;
    while (next < ac.currentTime + .15) {
      const nb = S2.roots.length, bar = Math.floor(step/16) % nb, i = step % 16, root = S2.roots[bar], third = S2.minor[bar] ? 15 : 16;
      if (S2.bass[i] !== null) voice('triangle', mf(root + S2.bass[i]), next, sd*1.8, .32);
      if (S2.arp) voice('square', mf(root + 24 + [0, third - 12, 7, 12][i % 4]), next, sd*.9, .035, 3200);
      if (S2.stab && S2.stab.includes(i)) [12, 19].forEach(d => voice('sawtooth', mf(root + d), next, sd*3, .03, 1400));
      if (S2.kick.includes(i)) hit(next, 'kick'); if (S2.snare.includes(i) || (S2.fill && bar === nb - 1 && S2.fill.includes(i))) hit(next, 'snare'); if (S2.hat.includes(i)) hit(next, 'hat');
      if (S2.lead && loops % (S2.leadEvery ? 1 : 2) === (S2.leadEvery ? 0 : 1) && S2.lead[bar][i] !== null) voice('square', mf(S2.lead[bar][i]), next, sd*2.6, .042, 2600);   // thème une boucle sur deux
      step++; if (step % (16*nb) === 0) loops++; next += sd;
    }
  }
  return {
    duck(d) { const ac = sfx.ctx(); if (!ac || !mg || !cur2) return; const t = ac.currentTime; mg.gain.cancelScheduledValues(t); mg.gain.setValueAtTime(mg.gain.value, t); mg.gain.linearRampToValueAtTime(0, t + .05); mg.gain.setValueAtTime(0, t + d); mg.gain.linearRampToValueAtTime(.75*SONGS[cur2].vol, t + d + .6); },
    set(name, r) { want = name; rate = r || 1; if (!mg && sfx.ctx()) { mg = sfx.ctx().createGain(); mg.gain.value = 0; mg.connect(sfx.out()); timer = setInterval(tick, 40); } },
  };
})();

// ---------- Boucle principale, pause et reprise pilotées par le SDK ----------
let last = performance.now(), raf = 0, firstFrame = false, lastErr = '';
function loop(now) {
  raf = requestAnimationFrame(loop);
  const dt = Math.min(.05, (now - last)/1000); last = now;
  try { update(dt); render(); } catch (e) { lastErr = String(e && e.message || e); try { if (typeof console !== 'undefined') console.error(e); } catch (e2) {} }   // une erreur ne doit jamais figer le jeu
  
  if (!firstFrame) { firstFrame = true; if (YT) { try { YT.game.firstFrameReady(); } catch (e) {} } }
}
function pause() { if (paused) return; paused = true; cancelAnimationFrame(raf); sfx.apply(); save(); }
function resume() { if (!paused) return; paused = false; last = performance.now(); sfx.apply(); raf = requestAnimationFrame(loop); }
if (YT) {
  try { audioOn = !!YT.system.isAudioEnabled(); YT.system.onAudioEnabledChange(v => { audioOn = !!v; sfx.apply(); }); } catch (e) {}
  try { YT.system.onPause(pause); YT.system.onResume(resume); } catch (e) {}
}

resize(); sfx.init();
raf = requestAnimationFrame(loop);
})();
</script>
